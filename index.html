<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Vivero Carnívoro | Plantas carnívoras</title>
  <meta name="description" content="Venta de plantas carnívoras y más. Pedidos por WhatsApp.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="header">
    <h1><a href="#/">🪤 Mi Vivero Carnívoro</a></h1>
    <button id="btnCarrito" class="btn-carrito">
      🛒 Carrito (<span id="contador">0</span>)
    </button>
  </header>

  <section class="hero">
    <h2>Encuentra tu próxima planta</h2>
    <p>Elige una categoría, escoge tu variedad y pide por WhatsApp.</p>
  </section>

  <main class="contenedor">
    <nav id="migas" class="migas"></nav>
    <div id="vista" class="grid"></div>
  </main>

  <!-- Si ya agregaste tu sección <section class="guia">, déjala aquí -->

  <aside id="panelCarrito" class="panel">
    <div class="panel-cabecera">
      <h3>Tu pedido</h3>
      <button id="btnCerrar">✖</button>
    </div>
    <div id="itemsCarrito"></div>
    <p class="total">Total: <span id="total">0</span></p>
    <input type="text" id="nombreCliente" placeholder="Tu nombre">
    <button id="btnPedir" class="btn-whatsapp">Enviar pedido por WhatsApp</button>
    <button id="btnVaciar" class="btn-secundario">Vaciar carrito</button>
  </aside>

  <footer class="footer">
    <p>© 2026 Mi Vivero Carnívoro</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/tienda.js"></script>
</body>
</html>
